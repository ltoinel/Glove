# nginx config for the Glove portal container.
# Serves the static SPA and forwards backend routes to the API container.
# `api` is the backend service name on the Docker Compose network.

upstream glove_api {
    server api:8080;
}

server {
    # Unprivileged image: the master process is not root, so no port < 1024.
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Do not advertise the nginx version in headers and error pages.
    server_tokens off;

    # Inherited by every location below (none sets its own add_header).
    # style-src needs 'unsafe-inline': MUI (emotion) and Leaflet inject styles
    # at runtime. Google Fonts is the only third-party origin the SPA loads.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # REST API and tile proxy.
    location /api/ {
        proxy_pass         http://glove_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Auto-generated OpenAPI specification.
    location /api-docs/ {
        proxy_pass       http://glove_api;
        proxy_set_header Host $host;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
