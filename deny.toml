# cargo-deny: supply-chain checks run by CI (`cargo deny check`).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Every RustSec advisory fails the build unless listed here with a reason.
ignore = [
    # bincode 1.x is unmaintained (development stopped, no successor release).
    # It only (de)serializes our own RAPTOR/BAN caches, never untrusted input;
    # replacing it (postcard / rkyv) is tracked separately.
    { id = "RUSTSEC-2025-0141", reason = "local cache format only, migration planned" },
]

[licenses]
# Permissive licenses only: the crate is MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

# KNOWN ISSUE, to be decided by the maintainer: actix-governor (per-IP rate
# limiting, server.rate_limit) is GPL-3.0-or-later, while Glove is MIT and its
# binary is distributed (Docker image). Allowed here explicitly so the problem
# stays visible instead of silently passing. Options: build the limiter on the
# `governor` crate (MIT/Apache-2.0) directly, or change Glove's license.
[[licenses.exceptions]]
crate = "actix-governor"
allow = ["GPL-3.0-or-later"]

[bans]
# Duplicate versions are common in the async ecosystem: report, don't fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
