[package]
name = "glove"
version = "0.2.0"
edition = "2024"

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
bincode = "1"
sha2 = "0.10"
actix-web = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = "0.9"
arc-swap = "1"
utoipa = { version = "5", features = ["actix_extras"] }
# rustls rather than the default native-tls: no OpenSSL system dependency, so
# the binary builds and cross-compiles without C toolchain setup.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustc-hash = "2"
# Only `future::join`/`join_all` are needed — the `futures` facade would also
# pull futures-executor, futures-sink and futures-channel.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
actix-cors = "0.7"
actix-governor = "0.7"
quick-xml = "0.36"
proj4rs = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
